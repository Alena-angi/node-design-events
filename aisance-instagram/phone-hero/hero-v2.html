<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Aisance — phone hero v2 (brand kit, no text)</title>
<style>
/* Brand kit: post background #103A3B → #2A7A7F, app accent #45DED1,
   glass panels = thin light border, NO teal glow. Real 1.6 screens only. */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; }
.frame { width: 1080px; height: 1350px; position: relative; overflow: hidden; }
.bg { position: absolute; inset: 0; background: linear-gradient(160deg, #103A3B 0%, #15494A 45%, #2A7A7F 100%); }
/* soft neutral studio light (white, not teal) */
.light { position: absolute; inset: 0;
  background: radial-gradient(700px 520px at 30% 18%, rgba(255,255,255,.07), transparent 70%),
              radial-gradient(900px 500px at 75% 100%, rgba(255,255,255,.06), transparent 70%); }
.grain { position: absolute; inset: 0; opacity: .05; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

.scene { position: absolute; inset: 0; perspective: 2600px; }
.floor { position: absolute; left: 50%; top: 1165px; width: 520px; height: 70px; transform: translateX(-44%);
  background: radial-gradient(closest-side, rgba(0,0,0,.45), transparent); filter: blur(12px); }

/* phone (titanium frame) */
.phone { position: absolute; left: 322px; top: 170px; width: 444px; height: 965px; border-radius: 76px;
  transform: rotateZ(-9deg) rotateY(-12deg) rotateX(4deg);
  background: linear-gradient(135deg, #8b9394 0%, #3a4041 20%, #16191a 50%, #3b4243 80%, #9aa2a3 100%);
  padding: 5px; box-shadow: -40px 60px 110px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.1); }
.phone .inner { width: 100%; height: 100%; border-radius: 71px; background: #000; padding: 11px; }
.screen { width: 100%; height: 100%; border-radius: 60px; background: #000; overflow: hidden; position: relative; }
.screen img { position: absolute; left: 0; top: 0; width: 100%; }
.glare { position: absolute; inset: 0; border-radius: 60px; background: linear-gradient(115deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,0) 30%); }
.btn { position: absolute; width: 5px; background: linear-gradient(90deg,#4a5253,#9aa2a3); border-radius: 3px; }

/* glass panels: frosted, thin light border, no colored glow */
.glass { position: absolute; padding: 18px;
  background: linear-gradient(135deg, rgba(255,255,255,.20), rgba(255,255,255,.07));
  border: 1.5px solid rgba(255,255,255,.35);
  backdrop-filter: blur(22px) saturate(120%); -webkit-backdrop-filter: blur(22px) saturate(120%);
  box-shadow: 0 30px 60px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.4); }
.glass img { display: block; width: 100%; }

/* top-right: what the user said (chat bubble) */
.g1 { left: 640px; top: 290px; width: 400px; border-radius: 60px; transform: rotate(-9deg); }
.g1 img { border-radius: 40px; }
/* bottom-left: budget row */
.g2 { left: 70px; top: 800px; width: 470px; border-radius: 44px; transform: rotate(-9deg); }
.g2 .clip { border-radius: 28px; overflow: hidden; height: 72px; }

body.no-bg .bg, body.no-bg .light, body.no-bg .grain, body.no-bg .floor { display: none; }
</style>
</head>
<body>
<div class="frame">
  <div class="bg"></div><div class="light"></div>
  <div class="scene">
    <div class="floor"></div>
    <div class="phone">
      <span class="btn" style="left:-3px;top:180px;height:40px"></span>
      <span class="btn" style="left:-3px;top:250px;height:70px"></span>
      <span class="btn" style="left:-3px;top:335px;height:70px"></span>
      <span class="btn" style="right:-3px;top:280px;height:110px"></span>
      <div class="inner"><div class="screen">
        <img src="assets/v16-analytics.png" alt="">
        <div class="glare"></div>
      </div></div>
    </div>
    <div class="glass g1"><img src="assets/ui-chat.png" alt=""></div>
    <div class="glass g2"><div class="clip"><img src="assets/ui-home-row.png" alt=""></div></div>
  </div>
  <div class="grain"></div>
</div>
</body>
</html>
