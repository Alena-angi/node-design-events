<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Aisance — close-up hand (no headline text)</title>
<style>
@font-face { font-family: "Manrope"; src: url(../fonts/Manrope-Medium.ttf); font-weight: 500; }
@font-face { font-family: "Manrope"; src: url(../fonts/Manrope-Bold.ttf); font-weight: 700; }
/* Brand kit lite: post bg #103A3B → #2A7A7F, accent #45DED1, glass = thin light border, no teal glow */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: transparent; font-family: "Manrope", sans-serif; }
.frame { width: 1080px; height: 1350px; position: relative; overflow: hidden; }

.bg { position: absolute; inset: 0; background: linear-gradient(165deg, #103A3B 0%, #17504F 50%, #2A7A7F 100%); }
/* soft "sky" light like the reference, neutral white */
.light { position: absolute; inset: 0;
  background: radial-gradient(800px 600px at 70% 15%, rgba(255,255,255,.08), transparent 70%),
              radial-gradient(700px 500px at 15% 90%, rgba(255,255,255,.05), transparent 70%); }
.grain { position: absolute; inset: 0; opacity: .05; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

.scene { position: absolute; inset: 0; perspective: 2600px; }

/* slot for the hand photo (behind phone) and finger (in front) — add in Figma */
.hand-back, .hand-front { position: absolute; inset: 0; pointer-events: none; }

/* phone — same angle and scale as the reference */
.phone { position: absolute; left: 318px; top: 360px; width: 430px; height: 935px; border-radius: 74px;
  transform: rotateZ(-10deg) rotateY(-14deg) rotateX(3deg);
  background: linear-gradient(135deg, #8b9394 0%, #3a4041 20%, #16191a 50%, #3b4243 80%, #9aa2a3 100%);
  padding: 5px; box-shadow: -30px 50px 100px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.1); }
.phone .inner { width: 100%; height: 100%; border-radius: 69px; background: #000; padding: 11px; }
.screen { width: 100%; height: 100%; border-radius: 58px; overflow: hidden; position: relative; background: #000; }
.screen img { position: absolute; left: 0; top: 0; width: 100%; }
.glare { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 30%); }
.btn { position: absolute; width: 5px; background: linear-gradient(90deg,#4a5253,#9aa2a3); border-radius: 3px; }

/* glass pills: light frosted, thin light border, no colored glow */
.glass { position: absolute; border-radius: 80px; overflow: hidden;
  background: linear-gradient(135deg, rgba(255,255,255,.34), rgba(255,255,255,.12));
  border: 1.5px solid rgba(255,255,255,.55);
  backdrop-filter: blur(16px) saturate(120%); -webkit-backdrop-filter: blur(16px) saturate(120%);
  box-shadow: 0 24px 50px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.6); }

/* pill 1 — top right, wave + value (like "56%") */
.p1 { left: 600px; top: 395px; width: 270px; height: 112px; transform: rotate(-10deg); }
.p1 svg { position: absolute; left: 18px; top: 16px; }
.p1 .val { position: absolute; right: 12px; top: 12px; width: 86px; height: 86px; border-radius: 50%; background: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 24px; color: #1B1E21; box-shadow: 0 6px 18px rgba(0,0,0,.15); }

/* pill 2 — left, crossing the phone edge, soft curve + chip (like "Calm") */
.p2 { left: 290px; top: 770px; width: 330px; height: 128px; transform: rotate(-10deg); }
.p2 svg { position: absolute; left: 0; top: 0; }
.p2 .chip { position: absolute; left: 92px; top: 56px; background: #fff; color: #1B1E21; border-radius: 10px; padding: 6px 12px;
  font-weight: 500; font-size: 18px; box-shadow: 0 4px 12px rgba(0,0,0,.15); }

body.no-bg .bg, body.no-bg .light, body.no-bg .grain { display: none; }
</style>
</head>
<body>
<div class="frame">
  <div class="bg"></div><div class="light"></div>
  <div class="scene">
    <div class="hand-back"></div>

    <div class="phone">
      <span class="btn" style="left:-3px;top:175px;height:40px"></span>
      <span class="btn" style="left:-3px;top:245px;height:68px"></span>
      <span class="btn" style="left:-3px;top:328px;height:68px"></span>
      <span class="btn" style="right:-3px;top:270px;height:108px"></span>
      <div class="inner"><div class="screen">
        <img src="assets/money.jpg" alt="">
        <div class="glare"></div>
      </div></div>
    </div>

    <div class="glass p1">
      <svg width="150" height="80" viewBox="0 0 150 80">
        <path d="M2 44 C 14 44, 18 14, 32 14 S 48 70, 62 70 S 78 22, 92 30 S 112 60, 124 44 S 140 24, 148 30" fill="none" stroke="#2F6FD0" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M2 50 C 16 50, 22 30, 36 34 S 54 62, 70 56 S 92 30, 108 40 S 132 56, 148 46" fill="none" stroke="#45DED1" stroke-width="3" stroke-linecap="round" opacity=".9"/>
      </svg>
      <div class="val">64%</div>
    </div>

    <div class="glass p2">
      <svg width="330" height="128" viewBox="0 0 330 128">
        <defs><linearGradient id="f2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
        <path d="M20 108 C 70 108, 90 40, 128 40 S 190 100, 230 70 S 290 36, 320 40 L320 128 L20 128Z" fill="url(#f2)"/>
        <path d="M20 108 C 70 108, 90 40, 128 40 S 190 100, 230 70 S 290 36, 320 40" fill="none" stroke="#2F6FD0" stroke-width="4" stroke-linecap="round"/>
        <line x1="128" y1="40" x2="128" y2="118" stroke="rgba(27,30,33,.25)" stroke-width="2" stroke-dasharray="4 5"/>
        <circle cx="128" cy="40" r="9" fill="#fff" stroke="#2F6FD0" stroke-width="4"/>
      </svg>
      <div class="chip">Calm</div>
    </div>

    <div class="hand-front"></div>
  </div>
  <div class="grain"></div>
</div>
</body>
</html>
