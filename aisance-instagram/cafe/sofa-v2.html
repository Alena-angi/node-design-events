<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Aisance 2.0 — live scene (sofa), cards on a curved arc</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.frame { width: 1080px; height: 1350px; position: relative; overflow: hidden; }
.photo { position: absolute; inset: 0; background: url(out/sofa-01-screen.png) center/cover; }
.grade { position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(10,14,16,.35) 0%, rgba(10,14,16,0) 35%, rgba(10,14,16,0) 70%, rgba(10,14,16,.35) 100%); }

/* cards sit on a cylinder around the phone: closest next to it, receding and shrinking to the sides */
.stage { position: absolute; left: 538px; top: 706px; perspective: 1500px; perspective-origin: 0 0; }
.ring  { position: absolute; transform-style: preserve-3d; transform: rotateZ(-4deg) translateZ(-700px); }
.card  { position: absolute; width: 158px; padding: 5px; border-radius: 18px;
  transform: translate(-50%, -50%) rotateY(var(--a)) translateZ(700px) translateY(var(--dy, 0px));
  padding: 3px;
  /* glass rim lit by the window on the left */
  background: linear-gradient(100deg, rgba(255,236,210,.32), rgba(255,255,255,.06) 55%, rgba(255,255,255,.12));
  border: 1px solid rgba(255,240,220,.38);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 18px 34px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3), inset 1px 1px 0 rgba(255,240,220,.45); }
.card img { display: block; width: 100%; border-radius: 15px; filter: blur(.35px) brightness(.9) contrast(.96); opacity: .96; }
/* warm reflection on the glass, like the room light */
.card::after { content: ""; position: absolute; inset: 3px; border-radius: 15px; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,214,170,.16) 0%, rgba(255,214,170,0) 40%); }
/* right side: the head is there, so the arc turns away into depth instead of running over him */
.card.right { transform: translate(-50%, -50%) translateZ(700px) translate3d(var(--x), var(--dy), var(--z)) rotateY(var(--a)); }
.far  { opacity: .82; filter: blur(.5px) brightness(.92); }
.far2 { opacity: .6;  filter: blur(1px) brightness(.85); }
.tone { position: absolute; inset: 0; background: rgba(255,170,90,.06); mix-blend-mode: soft-light; pointer-events: none; }
.grain { position: absolute; inset: 0; opacity: .10; mix-blend-mode: overlay; pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style>
</head>
<body>
<div class="frame">
  <div class="photo"></div><div class="grade"></div>
  <div class="stage"><div class="ring">
    <div class="card far2" style="--a:-46deg; --dy:6px"><img src="cards/sq-spend.png" alt=""></div>
    <div class="card far"  style="--a:-31deg; --dy:-4px"><img src="cards/sq-balance.png" alt=""></div>
    <div class="card"      style="--a:-16deg; --dy:4px"><img src="cards/sq-coffee.png" alt=""></div>
    <div class="card right" style="--x:160px; --z:-20px; --a:-22deg; --dy:-4px; width:132px"><img src="cards/sq-donut.png" alt=""></div>
    <div class="card right far" style="--x:300px; --z:-340px; --a:-50deg; --dy:-100px; width:128px"><img src="cards/sq-kept.png" alt=""></div>
  </div></div>
  <div class="tone"></div><div class="grain"></div>
</div>
</body>
</html>
